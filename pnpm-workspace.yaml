packages:
  - apps/*
  - packages/*
  - presentations/*
  - tools/*

catalogMode: prefer

catalog:
  # ⚠️ Toutes les versions sont PIN strictes (zéro `^`, zéro `~`, zéro `latest`).
  # Pour bumper : `vp pm view <pkg> version`, puis modifier ici, puis `vp install`.
  #
  # TypeScript toolchain
  "@types/node": 25.6.0
  typescript: 6.0.3
  "@typescript/native-preview": 7.0.0-dev.20260328.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  # Stack Hono + Datastar — partagée entre futures démos sous apps/demos.
  hono: 4.12.23
  "@hono/node-server": 1.19.14
  "@hono/vite-dev-server": 0.21.1
  "@starfederation/datastar-sdk": 1.0.0-RC.1
  # Tests E2E partagés.
  "@playwright/test": 1.60.0
  # Slidev.
  "@slidev/cli": 52.15.2
  slidev-theme-light-icons: 1.0.2
  # Vue : déjà tiré transitivement par Slidev (3.5.34). On le DÉCLARE pour que les
  # fichiers .ts du deck (i18n) résolvent ses types ; version PIN identique à
  # celle de Slidev → une seule instance vue (vite dédup au runtime).
  vue: 3.5.34
  # 3D — utilisé UNIQUEMENT par le deck butterfly-gpt (nuage de paramètres en 3D).
  three: 0.184.0
  "@types/three": 0.184.1
overrides:
  "@slidev/cli": "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - "@slidev/cli"
  allowedVersions:
    vite: "*"
    "@slidev/cli": "*"
patchedDependencies:
  slidev-theme-light-icons: patches/slidev-theme-light-icons.patch
# Vite+ gère les versions de pnpm et de Node (devEngines) : pnpm ne change pas de
# version et ne gère pas le runtime.
pmOnFail: ignore
runtimeOnFail: ignore
# Une release s'installe à trois jours.
minimumReleaseAge: 4320
# Versions exactes de la chaîne Vite+ 1.5.0, plus jeunes que minimumReleaseAge à leur
# installation. Chaque ligne part quand sa version a trois jours.
minimumReleaseAgeExclude:
  - "@oxc-project/runtime@0.157.0"
  - "@oxc-project/types@0.157.0"
  - "@oxfmt/binding-android-arm-eabi@0.76.0"
